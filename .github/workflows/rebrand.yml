name: Rebrand to Smoker-Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tool/rebrand.py"
      - "tool/fix2.py"
      - ".github/workflows/rebrand.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply rebrand + follow-up fixes
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/rebrand.py
          python3 tool/fix2.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Scope analysis to app code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("analysis_options.yaml").write_text(
              "include: package:flutter_lints/flutter.yaml\n"
              "\n"
              "analyzer:\n"
              "  exclude:\n"
              "    - build/**\n"
              "    # Vendored third-party plugin scaffolding: the example/ and test/ trees are\n"
              "    # standalone sub-projects with their own pubspecs and cannot resolve their\n"
              "    # imports from the app's analysis context.\n"
              "    - local_plugins/**/example/**\n"
              "    - local_plugins/**/test/**\n"
              "    - android/**\n"
          )
          print(Path("analysis_options.yaml").read_text())
          PY

      - name: Analyze
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        run: flutter test 2>&1 | tee test.log

      - name: Build debug APK (compile check)
        shell: bash
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Commit rebranded tree
        shell: bash
        run: |
          set -o pipefail
          {
            grep -q '^/android/build/$' .gitignore || printf '\n/android/build/\n/android/app/build/\n/android/.gradle/\n/android/local.properties\n/*.log\n' >> .gitignore
            git rm -r --cached --ignore-unmatch -q android/build 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            echo "=== staged files ==="
            git diff --cached --name-status
            if git diff --cached --quiet; then
              echo "Nothing to commit (already applied)"
              exit 0
            fi
            git commit -m "fix: complete Smoker-Agent branding [skip ci]"
            git push
          } 2>&1 | tee commit.log

      - name: Publish verification report
        if: always()
        shell: bash
        run: |
          {
            echo "# Smoker-Agent rebrand - verification report"
            echo
            echo "Job status: ${{ job.status }}"
            for f in analyze test build commit; do
              echo
              echo "## $f"
              echo '```'
              tail -60 "$f.log" 2>/dev/null || echo "(not run)"
              echo '```'
            done
          } > rebrand-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebrand-report.md
          git diff --cached --quiet || git commit -m "ci: rebrand verification report [skip ci]"
          git push || true
