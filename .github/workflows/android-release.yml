name: Android release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "tool/release.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk

      - name: Build architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smoker-agent-android
          path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(sed -n 's/^tag: *//p' tool/release.yaml | head -n1)"
          fi
          echo "Releasing $TAG"
          cat > notes.md <<EOF
          ## Smoker-Agent $TAG

          Download the APK for your device:

          - app-universal-release.apk - any device (ARM64, 32-bit ARM, x86_64), recommended
          - app-arm64-v8a-release.apk - most modern Android phones
          - app-armeabi-v7a-release.apk - older 32-bit ARM devices
          - app-x86_64-release.apk - emulators and x86_64 devices

          SHA-256 checksums for every file are in SHA256SUMS.txt.

          Install: allow install from unknown sources, install the APK (Android 8.0 / API 26 or newer), then enable Smoker-Agent Screen Control in Accessibility Settings. If Android blocks it as a "restricted setting", open Settings -> Apps -> Smoker-Agent -> Allow restricted settings first.

          Release APKs are signed with the debug keystore (the upstream default setup), so they install normally but cannot be uploaded to Google Play as-is.

          Based on the original PrivateAgent project by orailnoor and Tech Jarves: https://github.com/orailnoor/private-agent
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Smoker-Agent $TAG" \
              --notes-file notes.md
          fi
          echo "Published release $TAG"
